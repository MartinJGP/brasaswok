name: CI/CD Pipeline - Brasas & Wok

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  backend-ci:
    name: Backend CI (Java 21 / Spring Boot & Tests)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Código Fuente
        uses: actions/checkout@v4

      - name: Configurar JDK 21 (Eclipse Temurin)
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Otorgar Permisos de Ejecución al Maven Wrapper
        run: chmod +x backend/mvnw

      - name: Ejecutar Pruebas Unitarias e Integración (JUnit 5 + Mockito)
        run: |
          cd backend
          ./mvnw clean test

      - name: Compilar y Empaquetar JAR de Producción
        run: |
          cd backend
          ./mvnw clean package -DskipTests

      - name: Verificar Artefacto JAR Generado
        run: ls -la backend/target/*.jar

  frontend-ci:
    name: Frontend CI (Node 24 / Angular & Build)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Código Fuente
        uses: actions/checkout@v4

      - name: Configurar Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar Dependencias Frontend
        run: |
          cd frontend
          npm ci --legacy-peer-deps || npm install --legacy-peer-deps

      - name: Compilar Bundle de Producción (Angular)
        run: |
          cd frontend
          npm run build

      - name: Verificar Chunks Generados
        run: ls -la frontend/dist/frontend/browser
