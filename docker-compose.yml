version: '3.8'

services:
  # Base de Datos Relacional MySQL 8
  mysql:
    image: mysql:8.0
    container_name: brasaswok-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: brasas_wok_db
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  # Backend REST API + WebSockets (Spring Boot con Java 21)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: brasaswok-backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/brasas_wok_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root
      PORT: 8080
      APP_JWT_SECRET: super_secret_jwt_key_brasas_wok_2026_secure_development_key!
      APP_CORS_ALLOWED_ORIGINS: http://localhost,http://localhost:80,http://localhost:4200,http://frontend,https://*.vercel.app
    ports:
      - "8080:8080"

  # Frontend SPA + Proxy Inverso Nginx (Angular 19)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: brasaswok-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"

volumes:
  mysql_data:
    driver: local
