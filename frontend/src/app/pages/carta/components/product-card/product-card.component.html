<article
  class="group relative flex flex-col bg-brand-surface rounded-xl border border-brand-border overflow-hidden hover:border-brand-primary/40 transition-colors"
>
  <div
    class="relative w-full aspect-[16/10] overflow-hidden bg-brand-surface-alt cursor-pointer select-none"
    (click)="selectDish.emit(dish)"
    role="button"
    [attr.aria-label]="'Ver detalle de ' + dish.name"
  >
    <img
      [src]="dish.imageUrl"
      [alt]="dish.name"
      loading="lazy"
      class="w-full h-full object-cover transition-transform duration-300 group-hover:scale-105"
    />

    <div class="absolute top-2.5 left-2.5 flex items-center gap-1.5 pointer-events-none">
      <span class="text-[10px] font-bold uppercase tracking-wider px-2 py-0.5 rounded bg-brand-secondary/80 text-white">
        {{ dish.category }}
      </span>

      <span
        *ngIf="dish.isStar"
        class="text-[10px] font-bold px-2 py-0.5 rounded bg-brand-primary text-white flex items-center gap-1"
      >
        <app-icon name="flame" [size]="11"></app-icon>
        <span>Estrella</span>
      </span>
    </div>
  </div>

  <div class="p-4 flex-1 flex flex-col justify-between space-y-3">
    <div class="space-y-1">
      <h3
        (click)="selectDish.emit(dish)"
        class="text-base font-bold text-brand-text-primary group-hover:text-brand-primary transition-colors cursor-pointer leading-snug line-clamp-1 font-sans"
      >
        {{ dish.name }}
      </h3>

      <p class="text-xs text-brand-text-secondary leading-relaxed line-clamp-2">
        {{ dish.description }}
      </p>
    </div>

    <div class="pt-3 border-t border-brand-border flex items-center justify-between gap-3">
      <span class="text-base sm:text-lg font-bold text-brand-primary font-mono leading-none">
        S/ {{ dish.price.toFixed(2) }}
      </span>

      <div>
        <ng-container *ngIf="inCartQuantity === 0; else stepperTpl">
          <button
            type="button"
            (click)="quickAdd.emit(dish)"
            class="inline-flex items-center gap-1.5 px-3.5 py-1.5 bg-brand-primary hover:bg-brand-primary-hover text-white text-xs font-bold rounded-lg transition-all active:scale-95 focus:outline-none focus:ring-2 focus:ring-brand-primary"
            [attr.aria-label]="'Agregar ' + dish.name + ' al carrito'"
          >
            <app-icon name="plus" [size]="14"></app-icon>
            <span>Agregar</span>
          </button>
        </ng-container>

        <ng-template #stepperTpl>
          <div class="inline-flex items-center border border-brand-primary/40 bg-brand-primary/5 rounded-lg p-0.5">
            <button
              type="button"
              (click)="updateQuantity.emit({ dish: dish, delta: -1 })"
              class="w-6 h-6 rounded flex items-center justify-center text-brand-primary hover:bg-brand-primary hover:text-white transition-colors"
              aria-label="Disminuir cantidad"
            >
              <app-icon name="minus" [size]="12"></app-icon>
            </button>
            <span class="w-7 text-center text-xs font-bold text-brand-primary font-mono">
              {{ inCartQuantity }}
            </span>
            <button
              type="button"
              (click)="updateQuantity.emit({ dish: dish, delta: 1 })"
              class="w-6 h-6 rounded flex items-center justify-center text-brand-primary hover:bg-brand-primary hover:text-white transition-colors"
              aria-label="Aumentar cantidad"
            >
              <app-icon name="plus" [size]="12"></app-icon>
            </button>
          </div>
        </ng-template>
      </div>
    </div>
  </div>
</article>
