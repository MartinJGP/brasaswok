<div class="min-h-screen bg-brand-bg flex items-center justify-center p-4">
  <div class="max-w-md w-full bg-brand-surface rounded-2xl border border-brand-border p-6 sm:p-8 text-center space-y-5">
    <div class="w-12 h-12 rounded-xl bg-brand-primary/10 text-brand-primary mx-auto flex items-center justify-center">
      <app-icon name="flame" [size]="24"></app-icon>
    </div>

    <div class="space-y-1.5">
      <span class="text-3xl sm:text-4xl font-black font-mono text-brand-primary block">
        404
      </span>
      <h1 class="text-lg sm:text-xl font-bold text-brand-text-primary">
        Página No Encontrada
      </h1>
      <p class="text-xs text-brand-text-secondary leading-relaxed">
        La ruta a la que intentas ingresar no existe o fue movida.
      </p>
    </div>

    <div class="pt-1 flex flex-col sm:flex-row items-stretch gap-2.5">
      <a
        routerLink="/carta"
        class="flex-1 py-2.5 px-4 bg-brand-primary hover:bg-brand-primary-hover text-white text-xs font-semibold rounded-xl transition-colors shadow-sm flex items-center justify-center gap-2"
      >
        <app-icon name="menu" [size]="15"></app-icon>
        <span>Ver Carta Gastronómica</span>
      </a>

      <a
        routerLink="/"
        class="py-2.5 px-4 bg-brand-surface hover:bg-stone-50 text-brand-text-primary text-xs font-medium rounded-xl border border-brand-border transition-colors flex items-center justify-center"
      >
        Inicio
      </a>
    </div>
  </div>
</div>
