<div class="fixed inset-0 z-50 flex items-center justify-center p-4">
  <div
    class="fixed inset-0 bg-brand-secondary/70 backdrop-blur-md transition-opacity"
    (click)="close()"
    aria-hidden="true"
  ></div>

  <div
    class="relative w-full max-w-lg bg-brand-surface rounded-3xl shadow-2xl border border-brand-border overflow-hidden z-10 transition-all"
    role="dialog"
    aria-modal="true"
    aria-labelledby="modal-title"
  >
    <!-- Cabecera Limpia y Espaciosa -->
    <div class="px-6 py-5 border-b border-brand-border flex items-center justify-between bg-stone-50/50">
      <div class="flex items-center gap-3">
        <div class="w-9 h-9 rounded-xl bg-brand-primary flex items-center justify-center text-white shadow-sm shadow-brand-primary/30">
          <app-icon name="flame" [size]="18" customClass="text-white"></app-icon>
        </div>
        <div>
          <h3 id="modal-title" class="text-base font-extrabold text-brand-text-primary font-sans leading-tight">
            {{ activeTab === 'login' ? 'Iniciar Sesión' : 'Crear Cuenta' }}
          </h3>
          <p class="text-xs text-brand-text-secondary">Brasas a Wok • Acceso a Pedidos</p>
        </div>
      </div>

      <button
        type="button"
        (click)="close()"
        class="p-2 text-brand-text-muted hover:text-brand-text-primary hover:bg-stone-100 rounded-xl transition-colors"
        aria-label="Cerrar modal"
      >
        <app-icon name="x" [size]="18"></app-icon>
      </button>
    </div>

    <!-- Pantalla de Éxito Tras Autenticación -->
    <div *ngIf="isSuccess" class="p-10 text-center space-y-5">
      <div class="w-16 h-16 rounded-2xl bg-emerald-50 text-emerald-600 mx-auto flex items-center justify-center border border-emerald-200 shadow-sm">
        <app-icon name="check" [size]="32"></app-icon>
      </div>
      <div class="space-y-1.5">
        <h3 class="text-xl font-extrabold text-brand-text-primary font-sans">
          {{ successTitle }}
        </h3>
        <p class="text-sm text-brand-text-secondary max-w-sm mx-auto leading-relaxed">
          {{ successMessage }}
        </p>
      </div>
      <div class="inline-flex items-center gap-2 px-4 py-2 rounded-full bg-stone-100 border border-brand-border text-xs font-semibold text-brand-text-secondary">
        <span class="w-3.5 h-3.5 border-2 border-brand-primary border-t-transparent rounded-full animate-spin"></span>
        <span>Redirigiendo de forma segura...</span>
      </div>
    </div>

    <ng-container *ngIf="!isSuccess">
      <!-- Selector de Pestañas Mejorado -->
      <div class="px-6 pt-5 pb-2">
        <div class="flex bg-stone-100 p-1.5 rounded-2xl border border-brand-border/60 text-xs sm:text-sm font-bold">
          <button
            type="button"
            (click)="setTab('login')"
            [class.bg-white]="activeTab === 'login'"
            [class.text-brand-text-primary]="activeTab === 'login'"
            [class.shadow-sm]="activeTab === 'login'"
            [class.text-brand-text-secondary]="activeTab !== 'login'"
            class="flex-1 py-2.5 rounded-xl transition-all"
          >
            Iniciar Sesión
          </button>
          <button
            type="button"
            (click)="setTab('register')"
            [class.bg-white]="activeTab === 'register'"
            [class.text-brand-text-primary]="activeTab === 'register'"
            [class.shadow-sm]="activeTab === 'register'"
            [class.text-brand-text-secondary]="activeTab !== 'register'"
            class="flex-1 py-2.5 rounded-xl transition-all"
          >
            Registrarse
          </button>
        </div>
      </div>

      <!-- Alerta de Errores y Excepciones con Detalle -->
      <div class="px-6 pt-3" *ngIf="errorMessage">
        <div class="p-4 rounded-2xl bg-rose-50 border border-rose-200/80 text-rose-800 text-xs sm:text-sm space-y-2">
          <div class="flex items-start gap-2.5">
            <app-icon name="alert" [size]="18" customClass="text-rose-600 shrink-0 mt-0.5"></app-icon>
            <span class="font-bold leading-snug">{{ errorMessage }}</span>
          </div>

          <ul *ngIf="errorDetails.length > 0" class="pl-7 list-disc space-y-1 text-xs text-rose-700">
            <li *ngFor="let det of errorDetails">{{ det }}</li>
          </ul>
        </div>
      </div>

      <!-- Formulario Login Espacioso y Accesible -->
      <form *ngIf="activeTab === 'login'" (ngSubmit)="handleLogin()" class="p-6 space-y-4">
        <div>
          <label class="block text-xs sm:text-sm font-bold text-brand-text-primary mb-1.5">
            Usuario o Correo Electrónico
          </label>
          <div class="relative">
            <span class="absolute inset-y-0 left-0 flex items-center pl-3.5 text-brand-text-muted">
              <app-icon name="user" [size]="17"></app-icon>
            </span>
            <input
              type="text"
              [(ngModel)]="loginForm.username"
              name="username"
              required
              autocomplete="username"
              placeholder="ej: carlos_m o cliente@correo.com"
              class="w-full pl-10 pr-4 py-3 text-sm bg-brand-surface border border-brand-border rounded-xl text-brand-text-primary placeholder-brand-text-muted focus:border-brand-primary focus:ring-2 focus:ring-brand-primary/10 focus:outline-none transition-all"
            />
          </div>
        </div>

        <div>
          <div class="flex items-center justify-between mb-1.5">
            <label class="block text-xs sm:text-sm font-bold text-brand-text-primary">
              Contraseña
            </label>
            <span class="text-[11px] text-brand-text-secondary">Mínimo 6 caracteres</span>
          </div>
          <div class="relative">
            <span class="absolute inset-y-0 left-0 flex items-center pl-3.5 text-brand-text-muted">
              <app-icon name="lock" [size]="17"></app-icon>
            </span>
            <input
              [type]="showPassword ? 'text' : 'password'"
              [(ngModel)]="loginForm.password"
              name="password"
              required
              autocomplete="current-password"
              placeholder="••••••••"
              class="w-full pl-10 pr-11 py-3 text-sm bg-brand-surface border border-brand-border rounded-xl text-brand-text-primary placeholder-brand-text-muted focus:border-brand-primary focus:ring-2 focus:ring-brand-primary/10 focus:outline-none transition-all"
            />
            <button
              type="button"
              (click)="togglePasswordVisibility()"
              class="absolute inset-y-0 right-0 flex items-center pr-3.5 text-brand-text-muted hover:text-brand-text-primary transition-colors"
              title="Mostrar u ocultar contraseña"
            >
              <app-icon [name]="showPassword ? 'eye-off' : 'eye'" [size]="17"></app-icon>
            </button>
          </div>
        </div>

        <button
          type="submit"
          [disabled]="isLoading || !loginForm.username || !loginForm.password"
          class="w-full mt-2 py-3 px-5 bg-brand-primary hover:bg-brand-primary-hover disabled:opacity-50 text-white text-sm font-bold rounded-xl transition-all shadow-md shadow-brand-primary/20 flex items-center justify-center gap-2 active:scale-98"
        >
          <span *ngIf="isLoading" class="w-4 h-4 border-2 border-white border-t-transparent rounded-full animate-spin"></span>
          <span>{{ isLoading ? 'Comprobando credenciales...' : 'Iniciar Sesión' }}</span>
        </button>

        <p class="text-xs text-center text-brand-text-secondary pt-1">
          ¿Aún no tienes cuenta?
          <button type="button" (click)="setTab('register')" class="text-brand-primary font-bold hover:underline">
            Crear cuenta nueva
          </button>
        </p>
      </form>

      <!-- Formulario Registro Limpio con Validaciones Claras -->
      <form *ngIf="activeTab === 'register'" (ngSubmit)="handleRegister()" class="p-6 space-y-4">
        <div>
          <label class="block text-xs sm:text-sm font-bold text-brand-text-primary mb-1.5">
            Nombre Completo
          </label>
          <div class="relative">
            <span class="absolute inset-y-0 left-0 flex items-center pl-3.5 text-brand-text-muted">
              <app-icon name="user" [size]="17"></app-icon>
            </span>
            <input
              type="text"
              [(ngModel)]="registerForm.fullName"
              name="fullName"
              required
              placeholder="Carlos Mendoza"
              class="w-full pl-10 pr-4 py-2.5 text-sm bg-brand-surface border border-brand-border rounded-xl text-brand-text-primary placeholder-brand-text-muted focus:border-brand-primary focus:outline-none transition-all"
            />
          </div>
        </div>

        <div class="grid grid-cols-1 sm:grid-cols-2 gap-3.5">
          <div>
            <label class="block text-xs sm:text-sm font-bold text-brand-text-primary mb-1.5">
              Usuario
            </label>
            <input
              type="text"
              [(ngModel)]="registerForm.username"
              name="regUsername"
              required
              placeholder="carlos_m"
              class="w-full px-3.5 py-2.5 text-sm bg-brand-surface border border-brand-border rounded-xl text-brand-text-primary placeholder-brand-text-muted focus:border-brand-primary focus:outline-none transition-all"
            />
          </div>
          <div>
            <label class="block text-xs sm:text-sm font-bold text-brand-text-primary mb-1.5">
              Teléfono Celular
            </label>
            <input
              type="tel"
              [(ngModel)]="registerForm.phone"
              name="phone"
              placeholder="991 234 567"
              class="w-full px-3.5 py-2.5 text-sm bg-brand-surface border border-brand-border rounded-xl text-brand-text-primary placeholder-brand-text-muted focus:border-brand-primary focus:outline-none transition-all"
            />
          </div>
        </div>

        <div>
          <label class="block text-xs sm:text-sm font-bold text-brand-text-primary mb-1.5">
            Correo Electrónico
          </label>
          <div class="relative">
            <span class="absolute inset-y-0 left-0 flex items-center pl-3.5 text-brand-text-muted">
              <app-icon name="mail" [size]="17"></app-icon>
            </span>
            <input
              type="email"
              [(ngModel)]="registerForm.email"
              name="email"
              required
              placeholder="carlos.mendoza@gmail.com"
              class="w-full pl-10 pr-4 py-2.5 text-sm bg-brand-surface border border-brand-border rounded-xl text-brand-text-primary placeholder-brand-text-muted focus:border-brand-primary focus:outline-none transition-all"
            />
          </div>
        </div>

        <div>
          <label class="block text-xs sm:text-sm font-bold text-brand-text-primary mb-1.5">
            Dirección para Despacho
          </label>
          <div class="relative">
            <span class="absolute inset-y-0 left-0 flex items-center pl-3.5 text-brand-text-muted">
              <app-icon name="map-pin" [size]="17"></app-icon>
            </span>
            <input
              type="text"
              [(ngModel)]="registerForm.address"
              name="address"
              placeholder="Av. Javier Prado Este 123, Dpto 402"
              class="w-full pl-10 pr-4 py-2.5 text-sm bg-brand-surface border border-brand-border rounded-xl text-brand-text-primary placeholder-brand-text-muted focus:border-brand-primary focus:outline-none transition-all"
            />
          </div>
        </div>

        <div>
          <div class="flex items-center justify-between mb-1.5">
            <label class="block text-xs sm:text-sm font-bold text-brand-text-primary">
              Contraseña
            </label>
            <span class="text-[11px] text-brand-text-secondary">Mínimo 6 caracteres</span>
          </div>
          <div class="relative">
            <span class="absolute inset-y-0 left-0 flex items-center pl-3.5 text-brand-text-muted">
              <app-icon name="lock" [size]="17"></app-icon>
            </span>
            <input
              [type]="showPassword ? 'text' : 'password'"
              [(ngModel)]="registerForm.password"
              name="regPassword"
              required
              placeholder="••••••••"
              class="w-full pl-10 pr-11 py-2.5 text-sm bg-brand-surface border border-brand-border rounded-xl text-brand-text-primary placeholder-brand-text-muted focus:border-brand-primary focus:outline-none transition-all"
            />
            <button
              type="button"
              (click)="togglePasswordVisibility()"
              class="absolute inset-y-0 right-0 flex items-center pr-3.5 text-brand-text-muted hover:text-brand-text-primary transition-colors"
              title="Mostrar u ocultar contraseña"
            >
              <app-icon [name]="showPassword ? 'eye-off' : 'eye'" [size]="17"></app-icon>
            </button>
          </div>
        </div>

        <button
          type="submit"
          [disabled]="isLoading || !registerForm.username || !registerForm.email || !registerForm.password || !registerForm.fullName"
          class="w-full mt-3 py-3 px-5 bg-brand-primary hover:bg-brand-primary-hover disabled:opacity-50 text-white text-sm font-bold rounded-xl transition-all shadow-md shadow-brand-primary/20 flex items-center justify-center gap-2 active:scale-98"
        >
          <span *ngIf="isLoading" class="w-4 h-4 border-2 border-white border-t-transparent rounded-full animate-spin"></span>
          <span>{{ isLoading ? 'Creando cuenta...' : 'Crear Cuenta y Continuar' }}</span>
        </button>

        <p class="text-xs text-center text-brand-text-secondary pt-1">
          ¿Ya tienes cuenta activa?
          <button type="button" (click)="setTab('login')" class="text-brand-primary font-bold hover:underline">
            Inicia sesión aquí
          </button>
        </p>
      </form>
    </ng-container>
  </div>
</div>
