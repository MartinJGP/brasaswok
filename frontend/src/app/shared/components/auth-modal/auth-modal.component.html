<div class="fixed inset-0 z-50 flex items-center justify-center p-4">
  <div
    class="fixed inset-0 bg-brand-secondary/60 backdrop-blur-sm transition-opacity"
    (click)="close()"
    aria-hidden="true"
  ></div>

  <div
    class="relative w-full max-w-md bg-brand-surface rounded-2xl shadow-xl border border-brand-border overflow-hidden z-10"
    role="dialog"
    aria-modal="true"
    aria-labelledby="modal-title"
  >
    <!-- Cabecera -->
    <div class="p-5 border-b border-brand-border flex items-center justify-between">
      <div>
        <h3 id="modal-title" class="text-base font-bold text-brand-text-primary">
          {{ activeTab === 'login' ? 'Iniciar Sesión' : 'Crear Cuenta' }}
        </h3>
        <p class="text-xs text-brand-text-secondary mt-0.5">Brasas a Wok • Acceso Clientes</p>
      </div>

      <button
        type="button"
        (click)="close()"
        class="p-1.5 text-brand-text-muted hover:text-brand-text-primary rounded-lg transition-colors"
        aria-label="Cerrar modal"
      >
        <app-icon name="x" [size]="18"></app-icon>
      </button>
    </div>

    <!-- Éxito en autenticación -->
    <div *ngIf="isSuccess" class="p-8 text-center space-y-4">
      <div class="w-12 h-12 rounded-full bg-emerald-50 text-emerald-600 mx-auto flex items-center justify-center border border-emerald-200">
        <app-icon name="check" [size]="24"></app-icon>
      </div>
      <div class="space-y-1">
        <h3 class="text-base sm:text-lg font-bold text-brand-text-primary">
          {{ successTitle }}
        </h3>
        <p class="text-xs text-brand-text-secondary max-w-xs mx-auto">
          {{ successMessage }}
        </p>
      </div>
      <div class="inline-flex items-center gap-2 px-3 py-1.5 rounded-full bg-stone-50 border border-brand-border text-xs text-brand-text-secondary">
        <span class="w-3 h-3 border-2 border-brand-primary border-t-transparent rounded-full animate-spin"></span>
        <span>Redirigiendo...</span>
      </div>
    </div>

    <ng-container *ngIf="!isSuccess">
      <!-- Selector de pestañas -->
      <div class="p-5 pb-0">
        <div class="flex bg-stone-100 p-1 rounded-xl border border-brand-border/60 text-xs font-semibold">
          <button
            type="button"
            (click)="activeTab = 'login'; errorMessage = ''; successMessage = ''"
            [class.bg-white]="activeTab === 'login'"
            [class.text-brand-text-primary]="activeTab === 'login'"
            [class.shadow-sm]="activeTab === 'login'"
            [class.text-brand-text-secondary]="activeTab !== 'login'"
            class="flex-1 py-1.5 rounded-lg transition-all"
          >
            Iniciar Sesión
          </button>
          <button
            type="button"
            (click)="activeTab = 'register'; errorMessage = ''; successMessage = ''"
            [class.bg-white]="activeTab === 'register'"
            [class.text-brand-text-primary]="activeTab === 'register'"
            [class.shadow-sm]="activeTab === 'register'"
            [class.text-brand-text-secondary]="activeTab !== 'register'"
            class="flex-1 py-1.5 rounded-lg transition-all"
          >
            Registrarse
          </button>
        </div>
      </div>

      <!-- Mensaje de error -->
      <div class="px-5 pt-3" *ngIf="errorMessage">
        <div class="p-3 rounded-xl bg-rose-50 border border-rose-200 text-rose-700 text-xs flex items-center gap-2">
          <app-icon name="alert" [size]="15" customClass="shrink-0"></app-icon>
          <span>{{ errorMessage }}</span>
        </div>
      </div>

      <!-- Formulario Login -->
      <form *ngIf="activeTab === 'login'" (ngSubmit)="handleLogin()" class="p-5 space-y-4">
        <div>
          <label class="block text-xs font-semibold text-brand-text-primary mb-1">Usuario o Correo</label>
          <div class="relative">
            <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-brand-text-muted">
              <app-icon name="user" [size]="15"></app-icon>
            </span>
            <input
              type="text"
              [(ngModel)]="loginForm.username"
              name="username"
              required
              placeholder="ej: carlos_m o usuario"
              class="w-full pl-9 pr-3 py-2 text-xs bg-brand-surface border border-brand-border rounded-xl text-brand-text-primary placeholder-brand-text-muted focus:border-brand-primary focus:outline-none transition-colors"
            />
          </div>
        </div>

        <div>
          <label class="block text-xs font-semibold text-brand-text-primary mb-1">Contraseña</label>
          <div class="relative">
            <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-brand-text-muted">
              <app-icon name="lock" [size]="15"></app-icon>
            </span>
            <input
              type="password"
              [(ngModel)]="loginForm.password"
              name="password"
              required
              placeholder="••••••••"
              class="w-full pl-9 pr-3 py-2 text-xs bg-brand-surface border border-brand-border rounded-xl text-brand-text-primary placeholder-brand-text-muted focus:border-brand-primary focus:outline-none transition-colors"
            />
          </div>
        </div>

        <button
          type="submit"
          [disabled]="isLoading || !loginForm.username || !loginForm.password"
          class="w-full py-2.5 px-4 bg-brand-primary hover:bg-brand-primary-hover disabled:opacity-50 text-white text-xs font-semibold rounded-xl transition-colors shadow-sm"
        >
          {{ isLoading ? 'Ingresando...' : 'Iniciar Sesión' }}
        </button>
      </form>

      <!-- Formulario Registro -->
      <form *ngIf="activeTab === 'register'" (ngSubmit)="handleRegister()" class="p-5 space-y-3">
        <div>
          <label class="block text-xs font-semibold text-brand-text-primary mb-1">Nombre Completo</label>
          <input
            type="text"
            [(ngModel)]="registerForm.fullName"
            name="fullName"
            required
            placeholder="Carlos Mendoza"
            class="w-full px-3 py-2 text-xs bg-brand-surface border border-brand-border rounded-xl text-brand-text-primary placeholder-brand-text-muted focus:border-brand-primary focus:outline-none transition-colors"
          />
        </div>

        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-xs font-semibold text-brand-text-primary mb-1">Usuario</label>
            <input
              type="text"
              [(ngModel)]="registerForm.username"
              name="regUsername"
              required
              placeholder="carlos_m"
              class="w-full px-3 py-2 text-xs bg-brand-surface border border-brand-border rounded-xl text-brand-text-primary placeholder-brand-text-muted focus:border-brand-primary focus:outline-none transition-colors"
            />
          </div>
          <div>
            <label class="block text-xs font-semibold text-brand-text-primary mb-1">Celular</label>
            <input
              type="tel"
              [(ngModel)]="registerForm.phone"
              name="phone"
              placeholder="991234567"
              class="w-full px-3 py-2 text-xs bg-brand-surface border border-brand-border rounded-xl text-brand-text-primary placeholder-brand-text-muted focus:border-brand-primary focus:outline-none transition-colors"
            />
          </div>
        </div>

        <div>
          <label class="block text-xs font-semibold text-brand-text-primary mb-1">Correo Electrónico</label>
          <input
            type="email"
            [(ngModel)]="registerForm.email"
            name="email"
            required
            placeholder="carlos.m@gmail.com"
            class="w-full px-3 py-2 text-xs bg-brand-surface border border-brand-border rounded-xl text-brand-text-primary placeholder-brand-text-muted focus:border-brand-primary focus:outline-none transition-colors"
          />
        </div>

        <div>
          <label class="block text-xs font-semibold text-brand-text-primary mb-1">Dirección de Entrega</label>
          <input
            type="text"
            [(ngModel)]="registerForm.address"
            name="address"
            placeholder="Calle Los Pinos 432, San Isidro"
            class="w-full px-3 py-2 text-xs bg-brand-surface border border-brand-border rounded-xl text-brand-text-primary placeholder-brand-text-muted focus:border-brand-primary focus:outline-none transition-colors"
          />
        </div>

        <div>
          <label class="block text-xs font-semibold text-brand-text-primary mb-1">Contraseña</label>
          <input
            type="password"
            [(ngModel)]="registerForm.password"
            name="regPassword"
            required
            placeholder="Mínimo 6 caracteres"
            class="w-full px-3 py-2 text-xs bg-brand-surface border border-brand-border rounded-xl text-brand-text-primary placeholder-brand-text-muted focus:border-brand-primary focus:outline-none transition-colors"
          />
        </div>

        <button
          type="submit"
          [disabled]="isLoading || !registerForm.username || !registerForm.email || !registerForm.password || !registerForm.fullName"
          class="w-full mt-2 py-2.5 px-4 bg-brand-primary hover:bg-brand-primary-hover disabled:opacity-50 text-white text-xs font-semibold rounded-xl transition-colors shadow-sm"
        >
          {{ isLoading ? 'Creando cuenta...' : 'Crear Cuenta y Pedir' }}
        </button>
      </form>
    </ng-container>
  </div>
</div>
