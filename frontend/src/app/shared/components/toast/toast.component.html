<div
  *ngIf="toastService.toast() as currentToast"
  class="fixed bottom-5 right-4 left-4 sm:left-auto sm:right-5 sm:max-w-sm z-50 pointer-events-auto transition-all duration-300 animate-in fade-in slide-in-from-bottom-5"
>
  <div
    class="flex items-center gap-3 p-3.5 rounded-2xl shadow-lg border border-brand-border bg-brand-surface text-brand-text-primary"
  >
    <div
      class="w-9 h-9 rounded-xl flex items-center justify-center shrink-0"
      [ngClass]="{
        'bg-emerald-500/15 text-emerald-600': currentToast.type === 'success',
        'bg-sky-500/15 text-sky-600': currentToast.type === 'info',
        'bg-rose-500/15 text-rose-600': currentToast.type === 'error'
      }"
    >
      <app-icon
        [name]="currentToast.type === 'success' ? 'check' : (currentToast.type === 'info' ? 'log-out' : 'alert')"
        [size]="18"
      ></app-icon>
    </div>

    <div class="flex-1 text-xs font-semibold leading-snug">
      {{ currentToast.message }}
    </div>

    <button
      type="button"
      (click)="toastService.dismiss()"
      class="text-brand-text-muted hover:text-brand-text-primary p-1 rounded-lg hover:bg-brand-surface-alt transition-colors"
      aria-label="Cerrar notificación"
    >
      <app-icon name="x" [size]="14"></app-icon>
    </button>
  </div>
</div>
