<div *ngIf="dish" class="fixed inset-0 z-50 flex items-center justify-center p-4 overflow-y-auto">
  <div
    class="fixed inset-0 bg-brand-secondary/60 backdrop-blur-sm transition-opacity"
    (click)="close()"
    aria-hidden="true"
  ></div>

  <div
    class="relative w-full max-w-lg bg-brand-surface rounded-2xl shadow-xl border border-brand-border overflow-hidden z-10 my-8"
    role="dialog"
    aria-modal="true"
  >
    <!-- Imagen del plato -->
    <div *ngIf="dish.imageUrl" class="relative h-48 sm:h-56 w-full overflow-hidden bg-stone-100">
      <img
        [src]="dish.imageUrl"
        [alt]="dish.name"
        class="w-full h-full object-cover"
      />
      <button
        type="button"
        (click)="close()"
        class="absolute top-3 right-3 p-1.5 bg-black/50 hover:bg-black/70 text-white rounded-full transition-colors"
        aria-label="Cerrar modal"
      >
        <app-icon name="x" [size]="16"></app-icon>
      </button>

      <div class="absolute bottom-3 left-4 right-4 flex items-center justify-between">
        <span class="text-[11px] font-semibold uppercase tracking-wider px-2.5 py-0.5 rounded-full bg-white/95 text-brand-text-primary shadow-sm">
          {{ dish.category }}
        </span>
        <span *ngIf="dish.isStar" class="text-xs font-semibold text-amber-900 bg-amber-100/95 px-2.5 py-0.5 rounded-full flex items-center gap-1 shadow-sm">
          <app-icon name="flame" [size]="13"></app-icon>
          Plato Estrella
        </span>
      </div>
    </div>

    <!-- Cabecera si no hay imagen -->
    <div *ngIf="!dish.imageUrl" class="p-6 pb-4 border-b border-brand-border flex items-start justify-between">
      <div>
        <span class="text-[10px] font-bold uppercase tracking-wider text-brand-primary px-2 py-0.5 rounded-full bg-brand-primary/10">
          {{ dish.category }}
        </span>
        <h3 class="text-lg font-bold text-brand-text-primary mt-1.5 leading-snug">
          {{ dish.name }}
        </h3>
        <span class="text-base font-bold text-brand-primary font-mono block mt-1">
          S/ {{ dish.price.toFixed(2) }}
        </span>
      </div>

      <button
        type="button"
        (click)="close()"
        class="p-1.5 text-brand-text-muted hover:text-brand-text-primary rounded-lg transition-colors"
        aria-label="Cerrar modal"
      >
        <app-icon name="x" [size]="18"></app-icon>
      </button>
    </div>

    <!-- Título y precio cuando hay imagen -->
    <div *ngIf="dish.imageUrl" class="px-6 pt-5 pb-1">
      <h3 class="text-xl font-bold text-brand-text-primary leading-snug">
        {{ dish.name }}
      </h3>
      <span class="text-base font-bold text-brand-primary font-mono block mt-1">
        S/ {{ dish.price.toFixed(2) }}
      </span>
    </div>

    <!-- Cuerpo del modal -->
    <div class="p-6 space-y-5">
      <div>
        <h4 class="text-xs font-semibold text-brand-text-muted uppercase tracking-wider mb-1">Descripción</h4>
        <p class="text-xs sm:text-sm text-brand-text-secondary leading-relaxed">
          {{ dish.description }}
        </p>
      </div>

      <div>
        <label class="block text-xs font-semibold text-brand-text-primary mb-2">Cantidad</label>
        <div class="inline-flex items-center border border-brand-border rounded-xl p-0.5">
          <button
            type="button"
            (click)="decrement()"
            class="w-8 h-8 rounded-lg flex items-center justify-center text-brand-text-secondary hover:text-brand-primary hover:bg-stone-50 transition-colors"
            aria-label="Menos cantidad"
          >
            <app-icon name="minus" [size]="14"></app-icon>
          </button>
          <span class="w-10 text-center text-sm font-bold text-brand-text-primary font-mono">
            {{ quantity }}
          </span>
          <button
            type="button"
            (click)="increment()"
            class="w-8 h-8 rounded-lg flex items-center justify-center text-brand-text-secondary hover:text-brand-primary hover:bg-stone-50 transition-colors"
            aria-label="Más cantidad"
          >
            <app-icon name="plus" [size]="14"></app-icon>
          </button>
        </div>
      </div>

      <div>
        <label class="block text-xs font-semibold text-brand-text-primary mb-1.5">
          Instrucciones para cocina (Opcional)
        </label>
        <textarea
          [(ngModel)]="notes"
          rows="2"
          placeholder="Ej: Término de la carne, sin ensalada, ají pollero extra..."
          class="w-full px-3 py-2 text-xs bg-brand-surface border border-brand-border rounded-xl text-brand-text-primary placeholder-brand-text-muted focus:border-brand-primary focus:outline-none transition-colors resize-none"
        ></textarea>
      </div>
    </div>

    <!-- Pie del modal -->
    <div class="p-5 border-t border-brand-border bg-stone-50/50 flex items-center justify-between gap-4">
      <div class="text-left">
        <span class="text-[10px] text-brand-text-muted uppercase font-semibold block">Subtotal</span>
        <span class="text-base font-bold text-brand-text-primary font-mono">
          S/ {{ (dish.price * quantity).toFixed(2) }}
        </span>
      </div>

      <button
        type="button"
        (click)="handleAdd()"
        class="flex-1 py-2.5 px-4 bg-brand-primary hover:bg-brand-primary-hover text-white text-xs sm:text-sm font-semibold rounded-xl transition-colors shadow-sm flex items-center justify-center gap-2"
      >
        <app-icon name="shopping-bag" [size]="15"></app-icon>
        <span>Agregar al Pedido</span>
      </button>
    </div>
  </div>
</div>
